image: "thlmylab/swakkd:stable"

stages:
  - prepare
  - build
  - deploy
  - destroy

# Credentials for accessing the GitLab Docker registry
credentials:
  stage: prepare
  rules:
    - if: '$DEPLOY == "yes"'
  script:
    - kubectl delete secret gitlab-registry-credentials || true
    - "kubectl create secret docker-registry gitlab-registry-credentials \
                --docker-server=$CI_REGISTRY \
                --docker-username=image-registry \ 
                --docker-password=$CI_REGISTRY_TOKEN"

# Build and push the backend image
backend-img:
  stage: build
  image: docker:dind
  services: ["docker:dind"]
  rules:
    - if: '$DEPLOY == "yes"'
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $CI_REGISTRY_IMAGE/backend-$CI_COMMIT_REF_NAME:latest backend/
    - docker push $CI_REGISTRY_IMAGE/backend-$CI_COMMIT_REF_NAME:latest

# Build and push the frontend image
frontend-img:
  stage: build
  image: docker:dind
  services: ["docker:dind"]
  rules:
    - if: '$DEPLOY == "yes"'
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $CI_REGISTRY_IMAGE/frontend-$CI_COMMIT_REF_NAME:latest frontend/
    - docker push $CI_REGISTRY_IMAGE/frontend-$CI_COMMIT_REF_NAME:latest

# Deploy the backend and database
backend-db-deploy:
  stage: deploy
  rules:
    - if: '$DEPLOY == "yes"'
  script:
    - mo deploy/backend-dep.yaml | kubectl delete -f - || true
    - mo deploy/backend-dep.yaml | kubectl apply -f -
    - mo deploy/db-dep.yaml | kubectl apply -f -
    - mo deploy/backend-svc.yaml | kubectl apply -f -

# Deploy the frontend
frontend-deploy:
  stage: deploy
  rules:
    - if: '$DEPLOY == "yes"'
  script:
    - mo deploy/frontend-dep.yaml | kubectl delete -f - || true
    - mo deploy/frontend-dep.yaml | kubectl apply -f -
    - mo deploy/frontend-svc.yaml | kubectl apply -f -
    - mo deploy/frontend-ing.yaml | kubectl apply -f -
