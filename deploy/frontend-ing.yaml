apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt"
    acme.cert-manager.io/http01-edit-in-place: "true"
spec:
  rules:
  - host: "frontend-{{ CI_PROJECT_ID }}.{{ DOMAIN }}"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
  tls:
  - secretName: frontend-ing-cert
    hosts:
    - "frontend-{{ CI_PROJECT_ID }}.{{ DOMAIN }}"
