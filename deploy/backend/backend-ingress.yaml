# backend/backend-ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-ingress
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt"
    acme.cert-manager.io/http01-edit-in-place: "true"
spec:
  rules:
  - host: "backend-{{ CI_PROJECT_ID }}.edu.k8s.th-luebeck.dev"
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: backend-service
            port:
              number: 8000
  tls:
  - secretName: backend-ingress-cert
    hosts:
      - "backend-{{ CI_PROJECT_ID }}.edu.k8s.th-luebeck.dev"
