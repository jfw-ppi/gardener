apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
      - name: gitlab-registry-credentials
      containers:
      - name: backend
        image: "{{ CI_REGISTRY_IMAGE }}/backend-{{ CI_COMMIT_REF_NAME }}:latest"
        ports:
        - containerPort: {{ BACKEND_PORT }}
        env:
        - name: DB_HOST
          value: {{ DB_HOST }}
        - name: DB_PORT
          value: !!int {{ DB_PORT }}
        - name: DB_USER
          value: {{ DB_USER }}
        - name: DB_PASSWORD
          value: {{ DB_PASSWORD }}
        - name: DB_DATABASE
          value: {{ DB_DATABASE }}
        - name: BACKEND_URL
          value: {{ BACKEND_URL }}
        - name: BACKEND_PORT
          value: {{ BACKEND_PORT }}
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: postgresql-storage
      volumes:
      - name: postgresql-storage
        persistentVolumeClaim:
          claimName: postgresql-pvc
