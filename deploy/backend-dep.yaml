apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: {{ CI_REGISTRY_IMAGE }}/backend-{{ CI_COMMIT_REF_NAME }}:latest
        ports:
        - containerPort: 8000
        env:
        - name: DB_HOST
          value: "$DB_HOST"
        - name: DB_PORT
          value: "$DB_PORT"
        - name: DB_USER
          value: "$DB_USER"
        - name: DB_PASSWORD
          value: "$DB_PASSWORD"
        - name: DB_DATABASE
          value: "$DB_DATABASE"
        - name: BACKEND_PORT
          value: "$BACKEND_PORT"
