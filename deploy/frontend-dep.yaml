apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: {{ CI_REGISTRY_IMAGE }}/frontend-{{ CI_COMMIT_REF_NAME }}:latest
        ports:
        - containerPort: 8501
        env:
        - name: BACKEND_URL
          value: "$BACKEND_URL"  # Points to the internal backend service name
        - name: BACKEND_PORT
          value: "$BACKEND_PORT"
